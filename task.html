<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Match Predictor</title>
    <link rel="stylesheet" href="task.css">
</head>

<body>

    <div id="welcome-screen" class="screen active">
        <h1> Funny Career Matcher</h1>
        <p class="welcome-tag">Lights, camera, action!</p>
        <p>Get ready for the starring role you were born to play.</p>

        <button onclick="showScreen('input-screen')">Ready?</button>
    </div>
    <div id="input-screen" class="screen hidden">
        <h2>Set the Stage</h2>
        <br>
        <div class="input-group">
            <label for="userName">Enter your name...</label>
            <input type="text" id="userName" placeholder="Your Name" autocomplete="off">
        </div>
        <div class="input-group exam-group">
            <label>Select your exam</label>
            <input type="hidden" id="userExam" value="">
            <div class="exam-btn-grid">
                <button type="button" class="exam-btn" data-value="Banking">🏦 Banking</button>
                <button type="button" class="exam-btn" data-value="Railway">🚂 Railway</button>
                <button type="button" class="exam-btn" data-value="SSC">📝 SSC</button>
                <button type="button" class="exam-btn" data-value="UPSC">🏛️ UPSC</button>
                <button type="button" class="exam-btn" data-value="State PSC">📜 State PSC</button>
                <button type="button" class="exam-btn" data-value="Defence">🎖️ Defence</button>
                <button type="button" class="exam-btn" data-value="Police">🚔 Police</button>
                <button type="button" class="exam-btn" data-value="Teaching">📚 Teaching</button>
                <button type="button" class="exam-btn" data-value="Judiciary">⚖️ Judiciary</button>
                <button type="button" class="exam-btn" data-value="Insurance">🛡️ Insurance</button>
                <button type="button" class="exam-btn" data-value="Engineering/Medical">⚙️ Engg / Medical</button>
                <button type="button" class="exam-btn" data-value="Management">💼 Management</button>
                <button type="button" class="exam-btn" data-value="Other">🌀 Other</button>
            </div>
        </div>
        <button onclick="startLoading()">Reveal My Match 🌟</button>
    </div>

    <div id="loading-screen" class="screen hidden">
        <h2 id="loading-text">Analyzing your hidden talents...</h2>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div id="confetti-container"></div>
        <div class="result-layout">
            <div class="result-title"> DESTINY UNLOCKED! </div>
            <p id="result-intro"></p>
            <div id="career-output" class="career-match"></div>

            <button onclick="resetApp()">Respawn</button>
        </div>
    </div>

    <script src="task.js"></script>
</body>

</html>
